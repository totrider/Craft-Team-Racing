name: Idea or suggestion
description: Suggest a feature, a change, or a compatibility with another mod.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The roadmap (`docs/ROADMAP.md` in this repository) lists what is already planned. The mod follows the original game's behaviour by default, and anything beyond that is an opt-in extension (a different block, an item, a data pack entry or a setting), so say how your idea could be opt-in.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why, and how would you use it?
      description: What are you trying to do that is hard or impossible now?
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it?
      options:
        - New block, item or power-up
        - Change to how something works
        - Track building or race rules
        - Compatibility with another mod
        - Interface or quality of life
        - Something else
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, mock-ups, or how another game or mod does it.
