modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
logoBlur=false
description='''
Drive kart-racing-game karts through your Minecraft world. Build race tracks from ordinary blocks and a few nodes, race your friends with crates and power-ups, and play it all from a fresh survival world: craft a kart from a Power Palm's fruit.

Optional: Fusion, Create, Copycats+, Jade, Farm & Charm and Every Compat. Unofficial fan project, not affiliated with Activision, Sony, Naughty Dog or Mojang; it ships no assets from the original game.
'''
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Sable is a soft dependency (karts must also work without it). Declared optional so load order is right when present.
[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Jade is optional: with it, its pop-up is hidden while the player takes part in a race (client/server config of the mod: hideJadeInRace).
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15.0.0,)"
    ordering="NONE"
    side="CLIENT"

# Fusion (connected textures) is optional: with it, boost blocks of the same state join up (fusion-overrides/ in the jar);
# without it, the plain textures are used.
[[dependencies.${mod_id}]]
    modId="fusion"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="CLIENT"
